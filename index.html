<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Owen's Button</title>
        <link rel="icon" type="image/x-icon" href="res/owen.ico">
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: rgb(24, 26, 27);
                color: white;
            }
            nav {
                background-image: url("res/bg.png");
                margin: 0;
                padding: 0;
            }
            nav ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            nav ul li {
                float: left;
                padding: 5px 5px;
                margin: 0;
            }
            nav img {
                padding: 0;
                margin: 0;
            }
            .links {
                margin: 11px;
                padding: 0px 0px;
            }
            .button {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .center {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .chair {
                visibility: hidden;
            }
        </style>
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="index.html"><img src="res/owen.png" alt="Owen's Button.xyz" draggable="false" oncontextmenu="false"></a></li>
            </ul>
        </nav>

        <div class="button">
            <h1><center>OWEN'S BUTTON:</center></h1>
            <img src = res/button.png id="button"
                onmouseover="this.src='res/button_hover.png'"
                onmousedown="this.src='res/button_click.png'"
                onmouseup="this.src='res/button.png'"
                onmouseleave="this.src='res/button.png'">
            <input type="range" id="volume-thing">
        </div>
        <div class="center">
            <img src = "res/chair.gif" id="chair" class="chair">
        </div>
        <script type="text/javascript">
            window.onload = function() {
                var music = new Audio("res/cant_take_it.mp3");
                music.loop = true;
                var music_on = false;
                var chair = document.getElementById("chair");
                let volume = document.getElementById("volume-thing");
                volume.addEventListener("change", function(e) { music.volume = e.currentTarget.value / 100; })
                document.getElementById("button").onclick = function() { //owen music function
                    music.volume = volume.value / 100;
                    music_on = !music_on;
                    if (music_on)
                    {
                        music.play();
                        chair.style.visibility = "visible";
                    }
                    else
                    {
                        music.pause();
                        chair.style.visibility = "hidden";                
                    }
                    var sound = new Audio("res/voice-message(3).wav");
                    sound.volume = volume.value / 100;
                    sound.play();
                }
            }
        </script>
    </body>
</html>
